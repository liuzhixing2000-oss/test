name: BTC Expansion Breakout Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "btc_expansion_breakout_backtest.py"
      - "requirements.txt"
      - ".github/workflows/btc_breakout_backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC breakout backtest
        run: |
          python btc_expansion_breakout_backtest.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-breakout-results
          path: btc_breakout_results/
          if-no-files-found: warn
          retention-days: 30
